name: Kadraj
options:
  bundleIdPrefix: com.kadraj
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.4"

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTS_MACCATALYST: NO
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: NO

targets:
  Kadraj:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Kadraj/Sources
      - path: Kadraj/Resources
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kadraj.camera
        PRODUCT_NAME: Kadraj
        INFOPLIST_FILE: Kadraj/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    schemes:
      Kadraj:
        build:
          targets:
            Kadraj: all
